name: Run Job Search Agent

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Palabras clave de búsqueda (ej. Strategy AI Lead)'
        required: true
        default: 'Strategy AI Lead'
      location:
        description: 'Ubicación (ej. Madrid)'
        required: true
        default: 'Madrid'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping global install"
          fi

      - name: Run Search Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Iniciando agente en Python para: ${{ github.event.inputs.keywords }} en ${{ github.event.inputs.location }}"
          # Ejecutamos el validador de habilidades nativo del repositorio antes de lanzar la búsqueda
          python tools/lint_skills.py
          
          # Lanzamos el comando de búsqueda con tus parámetros
          python .agents/skills/linkedin-search/index.py --search "${{ github.event.inputs.keywords }}" --location "${{ github.event.inputs.location }}" || python .agents/skills/linkedin-search/search.py --search "${{ github.event.inputs.keywords }}" --location "${{ github.event.inputs.location }}"
