name: Run Job Search Agent

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Palabras clave de búsqueda (ej. Strategy AI Lead)'
        required: true
        default: 'Strategy AI Lead'
      location:
        description: 'Ubicación (ej. Madrid)'
        required: true
        default: 'Madrid'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Search Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Iniciando agente en Python para: ${{ github.event.inputs.keywords }} en ${{ github.event.inputs.location }}"
          
          # Intentamos ejecutar el buscador de LinkedIn nativo de la carpeta .agents
          if [ -f .agents/skills/linkedin-search/index.py ]; then
            python .agents/skills/linkedin-search/index.py --search "${{ github.event.inputs.keywords }}" --location "${{ github.event.inputs.location }}"
          elif [ -f .agents/skills/linkedin-search/search.py ]; then
            python .agents/skills/linkedin-search/search.py --search "${{ github.event.inputs.keywords }}" --location "${{ github.event.inputs.location }}"
          else
            echo "Buscando scripts alternativos en la carpeta de agentes..."
            ls -la .agents/skills/
          fi
